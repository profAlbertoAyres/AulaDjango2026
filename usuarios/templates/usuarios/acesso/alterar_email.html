{% extends "base_site.html" %}

{% block title %}Alterar e-mail | Personal Trainer{% endblock %}

{% block content %}
<section class="py-secao">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card card-fitness shadow-sm">
          <div class="card-body p-4">
            <h2 class="titulo-secao mb-4">Alterar e-mail</h2>

            {% if form.errors %}
              <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                Verifique o e-mail informado e tente novamente.
              </div>
            {% endif %}

            <form method="post">
              {% csrf_token %}

              <div class="mb-3">
                <label for="{{ form.email.id_for_label }}" class="form-label fw-semibold">Novo e-mail</label>
                {{ form.email }}
              </div>

              <button type="submit" class="btn btn-fitness w-100">
                <i class="bi bi-envelope me-1"></i>Salvar
              </button>
            </form>

            <div class="d-flex flex-column align-items-end mt-4 gap-2">
              <a href="{% url 'home' %}" class="small text-secondary text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Voltar ao site
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
