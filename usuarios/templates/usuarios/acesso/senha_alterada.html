{% extends "base_site.html" %}

{% block title %}Senha alterada | Personal Trainer{% endblock %}

{% block content %}
<section class="py-secao">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card card-fitness shadow-sm">
          <div class="card-body p-4 text-center">
            <i class="bi bi-check-circle text-success display-5 mb-3 d-block"></i>
            <h2 class="titulo-secao mb-3">Senha alterada com sucesso!</h2>
            <p class="mb-4">Sua senha foi atualizada. Use a nova senha no seu próximo acesso.</p>

            <a href="{% url 'usuarios:aluno_dashboard' %}" class="btn btn-fitness w-100">
              <i class="bi bi-arrow-left me-1"></i>Voltar
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
