{% extends "base_site.html" %}

{% block title %}Verifique seu e-mail | Personal Trainer{% endblock %}

{% block content %}
<section class="py-secao">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card card-fitness shadow-sm">
          <div class="card-body p-4 text-center">
            <i class="bi bi-envelope-check text-primary display-5 mb-3 d-block"></i>
            <h2 class="titulo-secao mb-3">Verifique seu e-mail</h2>
            <p class="mb-4">Se o e-mail informado existir em nossa base, você receberá as instruções de recuperação em instantes.</p>

            <a href="{% url 'login' %}" class="btn btn-fitness w-100">
              <i class="bi bi-arrow-left me-1"></i>Voltar ao login
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
